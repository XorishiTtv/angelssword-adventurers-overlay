name: Update Streamer.bot branch

on:
  push:
    branches:
      - agent/streamerbot-api

permissions:
  contents: write

jobs:
  merge-main-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/streamerbot-api
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Merge main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "Merge main into agent/streamerbot-api"

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check automation-api.js
          node --check public/overlay.js
          node --check public/webcam-preview-toggle.js
          node --check test/api-v1-smoke.js

      - name: Run API smoke test
        run: npm run test:api

      - name: Check diff
        run: git diff --check

      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/update-streamerbot-branch.yml
          git add -A
          git commit -m "Remove temporary branch update workflow"
          git push origin HEAD:agent/streamerbot-api
