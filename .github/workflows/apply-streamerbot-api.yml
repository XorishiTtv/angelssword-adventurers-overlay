name: Apply Streamer.bot API

on:
  push:
    branches:
      - agent/streamerbot-api

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply integration
        run: |
          python3 .github/apply-streamerbot-api.py
          rm .github/apply-streamerbot-api.py

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check automation-api.js
          node --check public/overlay.js
          node --check test/api-v1-smoke.js

      - name: Run API smoke test
        run: npm run test:api

      - name: Check diff
        run: git diff --check

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/overlay.js package.json automation-api.js test/api-v1-smoke.js docs/STREAMERBOT_API.md .github/apply-streamerbot-api.py
          git commit -m "Add Streamer.bot automation API"
          git push origin HEAD:agent/streamerbot-api
